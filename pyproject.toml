[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bundle-useful-skills"
version = "1.0.0"
description = "Zero-dependency Agent Skills router, cryptographic lockfile registry, and focused bundle orchestrator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Bundle Useful Skills Contributors" }
]
keywords = [
    "agent-skills",
    "ai-agents",
    "skills-router",
    "claude-code",
    "antigravity",
    "codex",
    "cursor",
    "software-engineering"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ammasyaa/bundle-useful-skills"
Repository = "https://github.com/ammasyaa/bundle-useful-skills.git"
Issues = "https://github.com/ammasyaa/bundle-useful-skills/issues"
Changelog = "https://github.com/ammasyaa/bundle-useful-skills/blob/main/CHANGELOG.md"

[project.scripts]
bus = "router.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["router*"]

[tool.setuptools.package-data]
"router" = ["SKILL.md", "references/*", "conflicts/*", "profiles/*", "verification/*"]
